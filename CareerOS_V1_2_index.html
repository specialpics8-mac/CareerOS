<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerOS</title>
<style>
body{margin:0;background:#f5f6f8;color:#111827;font:14px system-ui,-apple-system,sans-serif}.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:800}
nav{display:flex;gap:6px;overflow:auto;margin-bottom:16px}button,.btn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;text-decoration:none;color:inherit}button.active,.primary{background:#111827;color:white;border-color:#111827}
.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric b{display:block;font-size:26px}.muted{color:#6b7280;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px;padding:10px;background:white}textarea{min-height:180px}.form{display:grid;gap:10px}.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{font-size:42px;font-weight:850}.high{color:#15803d}.mid{color:#b45309}.low{color:#b91c1c}.toolbar{display:flex;gap:8px;margin-bottom:12px}.empty{text-align:center;padding:30px;color:#6b7280;border:1px dashed #ddd;border-radius:10px}
dialog{border:0;border-radius:12px;width:min(720px,calc(100% - 24px));padding:0}dialog::backdrop{background:#0007}.modal{padding:18px}.close{float:right}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.form2{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><header><div class="brand">CareerOS</div><button id="settings">⚙ Settings</button></header><nav id="nav"></nav><div id="view"></div></main>
<dialog id="dlg"><div class="modal" id="modal"></div></dialog>
<script>
const tabs=[["dashboard","Dashboard"],["analyze","Analyze Job"],["applications","Applications"],["companies","Companies"],["resumes","Resumes"]];
const S={tab:"dashboard",backend:localStorage.careerOSBackend||"",applications:[],companies:[],resumes:[],analysis:null,connected:false};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():"x"+Date.now()+Math.random();
function url(){return S.backend.replace(/\/+$/,"")} function ok(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(url())}
async function api(action,p={}){if(!ok())throw Error("Connect the Apps Script /exec URL in Settings.");let q=new URLSearchParams({action});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));let r=await fetch(url()+"?"+q);let d=await r.json();if(d.error)throw Error(d.error);return d}
async function post(action,p={}){if(!ok())throw Error("Connect the Apps Script /exec URL in Settings.");let q=new URLSearchParams({action});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));let r=await fetch(url(),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:q});let d=await r.json();if(d.error)throw Error(d.error);return d}
function open(t,b){modal.innerHTML=`<button class=close onclick="dlg.close()">×</button><h3>${t}</h3>${b}`;dlg.showModal()}
async function load(name){try{let d=await api("fetchAll");S.applications=(d.Applications||[]).map(x=>({id:x.ID,company:x.Company,title:x.Title,status:x.Status||"Saved",dateApplied:x.DateApplied||"",resumeId:x.ResumeID||"",followUpDate:x.FollowUpDate||"",notes:x.Notes||""}));S.companies=(d.Companies||[]).map(x=>({id:x.ID,name:x.Name,category:x.Category,sourceUrl:x.SourceURL||"",active:String(x.Active).toLowerCase()!=="false"}));S.resumes=(d.ResumeLibrary||[]).map(x=>({id:x.ID,name:x.Name,type:x.Type,fileUrl:x.FileURL||"",targetRole:x.TargetRole||"",targetCompany:x.TargetCompany||"",createdAt:x.CreatedAt||""}));S.connected=true;render()}catch(e){S.connected=false;alert(e.message)}}
function saveState(){localStorage.careerOSBackend=S.backend}
async function save(sheet,r){await api("save",Object.assign({sheet},r))}
function renderNav(){nav.innerHTML=tabs.map(x=>`<button class="${S.tab==x[0]?"active":""}" onclick="S.tab='${x[0]}';render()">${x[1]}</button>`).join("")}
function render(){renderNav();view.innerHTML=V[S.tab]();bind()}
function scoreClass(n){return n>=85?"high":n>=70?"mid":"low"}
function app(a){return`<div class=card><div class=row><div><b>${esc(a.title)}</b><div class=muted>${esc(a.company)} · ${esc(a.status)}</div></div><div class=actions><button onclick="editApp('${a.id}')">Open</button></div></div></div>`}
const V={
dashboard:()=>`<div class=grid><div class="card metric"><span class=muted>Applications</span><b>${S.applications.length}</b></div><div class="card metric"><span class=muted>Active</span><b>${S.applications.filter(a=>!["Rejected","Withdrawn","Offer"].includes(a.status)).length}</b></div><div class="card metric"><span class=muted>Interviews</span><b>${S.applications.filter(a=>["Interview","Final"].includes(a.status)).length}</b></div><div class="card metric"><span class=muted>Resumes</span><b>${S.resumes.length}</b></div></div><div class=card style="margin-top:12px"><b>Start here</b><p class=muted>Paste a job link → analyze → choose the best resume → track the application.</p><button class=primary onclick="S.tab='analyze';render()">Analyze a job</button></div><h3>Recent applications</h3>${S.applications.slice(0,5).map(app).join("")||"<div class=empty>No applications yet.</div>"}`,
analyze:()=>`<div class=card><h3>Analyze Job</h3><div class=toolbar><input class=input id=jobUrl placeholder="Paste job link…" value="${esc(S.analysis?.url||"")}"><button class=primary onclick=analyze()>Analyze</button></div><div class=muted>CareerOS first tries to read the job page. If blocked, paste the JD.</div></div>${S.analysis?analysis():''}`,
applications:()=>`<div class=toolbar><button class=primary onclick=addApp()>+ Add application</button><button onclick=load('apps')>↻ Refresh</button></div>${S.applications.map(app).join("")||"<div class=empty>No applications yet.</div>"}`,
companies:()=>`<div class=toolbar><input class=input id=csearch placeholder="Search companies…" oninput=filterCompanies()></div><div id=companies>${S.companies.map(company).join("")}</div>`,
resumes:()=>`<div class=card><div class=row><div><b>Resume Library</b><div class=muted>Your real resume versions used for job matching.</div></div><button class=primary onclick=upload()>+ Upload</button></div>${S.resumes.map(r=>`<div class=card><div class=row><div><b>${esc(r.name)}</b><div class=muted>${esc(r.type||"Resume")} ${r.targetRole?"· "+esc(r.targetRole):""}</div></div><div class=actions>${r.fileUrl?`<a class=btn href="${esc(r.fileUrl)}" target=_blank>Open ↗</a>`:""}<button onclick="delResume('${r.id}')">Delete</button></div></div></div>`).join("")||"<div class=empty>Upload a resume.</div>"}`
};
function company(c){return`<div class=card><div class=row><div><b>${esc(c.name)}</b><div class=muted>${esc(c.category||"")}</div></div><div class=actions>${c.sourceUrl?`<a class="btn primary" target=_blank href="${esc(c.sourceUrl)}">Careers ↗</a>`:""}<button onclick="editCompany('${c.id}')">Edit</button></div></div></div>`}
function analysis(){let a=S.analysis;if(a.needsJdPaste)return`<div class=card><b>Paste JD</b><p class=muted>${esc(a.error)}</p><textarea id=fallback class=input></textarea><button class=primary onclick=pasteAnalyze()>Analyze JD</button></div>`;let b=a.bestResume;return`<div class=card><div class=muted>BEST MATCH</div><div class="score ${scoreClass(+a.match)}">${a.match}%</div><h3>${esc(b?.name||"No resume")}</h3><p>${esc(a.recommendation||"")}</p><div class=actions>${b?`<button class=primary onclick="createApp('${b.id}')">Track application</button>`:""}<a class=btn href="${esc(a.url)}" target=_blank>Open job ↗</a></div><p class=muted>${esc(a.reliability||"")}</p></div>`}
async function analyze(){try{let u=jobUrl.value.trim();if(!u)return alert("Paste a job URL.");S.analysis=await api("analyzeJob",{url:u});render()}catch(e){alert(e.message)}}
async function pasteAnalyze(){try{S.analysis=await post("analyzePastedJob",{url:S.analysis?.url||jobUrl.value,jd:fallback.value});render()}catch(e){alert(e.message)}}
async function createApp(rid){let a=S.analysis;open("Track application",`<form class=form id=af><div class=form2><label>Company<input class=input name=company value="${esc(a.company||"")}"></label><label>Role<input class=input name=title value="${esc(a.title||"")}"></label></div><label>Status<select class=input name=status><option>Applied</option><option>Saved</option><option>Recruiter Screen</option><option>Interview</option><option>Final</option><option>Offer</option><option>Rejected</option></select></label><button class=primary>Save</button></form>`);af.onsubmit=async e=>{e.preventDefault();let f=new FormData(af),r={id:id(),jobId:"",company:f.get("company"),title:f.get("title"),status:f.get("status"),dateApplied:new Date().toISOString(),resumeId:rid,recruiter:"",nextAction:"",followUpDate:"",notes:""};await save("Applications",r);S.applications.unshift(r);dlg.close();S.tab="applications";render()}}
async function addApp(){open("Add application",`<form class=form id=af><div class=form2><label>Company<input class=input name=company required></label><label>Role<input class=input name=title required></label></div><label>Status<select class=input name=status><option>Applied</option><option>Saved</option><option>Recruiter Screen</option><option>Interview</option><option>Rejected</option></select></label><button class=primary>Save</button></form>`);af.onsubmit=async e=>{e.preventDefault();let f=new FormData(af),r={id:id(),jobId:"",company:f.get("company"),title:f.get("title"),status:f.get("status"),dateApplied:new Date().toISOString(),resumeId:"",recruiter:"",nextAction:"",followUpDate:"",notes:""};await save("Applications",r);S.applications.unshift(r);dlg.close();render()}}
async function editApp(rid){let a=S.applications.find(x=>x.id==rid);open("Application",`<form class=form id=ef><div class=form2><label>Company<input class=input name=company value="${esc(a.company)}"></label><label>Role<input class=input name=title value="${esc(a.title)}"></label></div><label>Status<select class=input name=status>${["Saved","Preparing","Applied","Recruiter Screen","Interview","Final","Offer","Rejected","Withdrawn"].map(s=>`<option ${s==a.status?"selected":""}>${s}</option>`).join("")}</select></label><label>Follow-up<input class=input type=date name=followUpDate value="${esc(String(a.followUpDate||"").slice(0,10))}"></label><button class=primary>Save</button><button type=button onclick="delApp('${rid}')">Delete application</button></form>`);ef.onsubmit=async e=>{e.preventDefault();let f=new FormData(ef);Object.assign(a,{company:f.get("company"),title:f.get("title"),status:f.get("status"),followUpDate:f.get("followUpDate")});await save("Applications",a);dlg.close();render()}}
async function delApp(rid,evt){if(!confirm("Delete this application?"))return;const b=evt?.currentTarget;if(b){b.disabled=true;b.textContent='Deleting…'}try{const d=await api("deleteApplicationFast",{id:rid});if(!d.ok)throw Error(d.error||'Delete failed');S.applications=S.applications.filter(x=>x.id!=rid);dlg.close();render()}catch(e){if(b){b.disabled=false;b.textContent='Delete application'}alert("Delete failed: "+e.message)}}
async function upload(){open("Upload resume",`<form class=form id=uf><input class=input type=file name=file accept=".pdf,.doc,.docx,.txt" required><div class=form2><input class=input name=targetRole placeholder="Target role"><input class=input name=targetCompany placeholder="Target company"></div><button class=primary>Upload</button></form>`);uf.onsubmit=async e=>{e.preventDefault();let f=new FormData(uf),file=f.get("file");if(file.size>5*1024*1024)return alert("Max 5 MB.");let rd=new FileReader();rd.onload=async()=>{try{let d=await post("uploadResumeFile",{name:file.name,mimeType:file.type,base64:String(rd.result).split(",")[1],type:"Resume",targetRole:f.get("targetRole"),targetCompany:f.get("targetCompany"),notes:""});S.resumes.unshift(d.record);dlg.close();render()}catch(x){alert(x.message)}};rd.readAsDataURL(file)}}
async function delResume(rid){if(!confirm("Delete this resume?"))return;try{let d=await api("deleteResumeFast",{id:rid});if(!d.ok)throw Error(d.error||"Delete failed");S.resumes=S.resumes.filter(x=>x.id!=rid);render()}catch(e){alert("Delete failed: "+e.message)}}
function editCompany(cid){let c=S.companies.find(x=>x.id==cid);open("Company",`<form class=form id=cf><input class=input name=name value="${esc(c.name)}"><input class=input name=sourceUrl value="${esc(c.sourceUrl)}" placeholder="Careers URL"><button class=primary>Save</button></form>`);cf.onsubmit=async e=>{e.preventDefault();let f=new FormData(cf);c.name=f.get("name");c.sourceUrl=f.get("sourceUrl");await save("Companies",c);dlg.close();render()}}
function filterCompanies(){let q=csearch.value.toLowerCase();companies.innerHTML=S.companies.filter(c=>(c.name+" "+c.category).toLowerCase().includes(q)).map(company).join("")}
settings.onclick=()=>{open("Settings",`<form class=form id=sf><label>Apps Script /exec URL<input class=input name=url value="${esc(S.backend)}"></label><div class=muted>Gmail sync should be authorized by the same Google account that owns the Web App. CareerOS V1 uses one mailbox: vishalnihalani2@gmail.com.</div><button class=primary>Save & connect</button></form>`);sf.onsubmit=async e=>{e.preventDefault();S.backend=sf.url.value.trim();saveState();dlg.close();await load()}}
function bind(){}
render();if(ok())load();
</script></body></html>
