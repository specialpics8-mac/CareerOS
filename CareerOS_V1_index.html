<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>CareerOS</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;overflow:auto;margin-bottom:18px}nav button{border:0;background:transparent;padding:10px 13px;border-radius:9px;color:var(--muted);white-space:nowrap}nav button.active{background:#111827;color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:27px;font-weight:800;margin-top:5px}
.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.section-head h2{font-size:15px;margin:0}
.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.title{font-weight:700}.company{font-size:13px;color:var(--muted);margin-top:3px}.meta{font-size:12px;color:var(--muted);margin-top:7px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:#fff;padding:8px 11px;border-radius:8px;font-size:12px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.dark{background:#111827;color:#fff;border-color:#111827}.btn.danger{color:var(--red)}
.score{font-weight:800;padding:5px 8px;border-radius:8px;font-size:12px}.high{background:#f0fdf4;color:var(--green)}.mid{background:#fffbeb;color:var(--amber)}.low{background:#fef2f2;color:var(--red)}
.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#f3f4f6;color:#374151;font-size:11px}.notice{padding:11px 12px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:12px;margin-bottom:12px}
.input{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px;background:#fff}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:650}.form textarea{min-height:170px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;background:#fff}
.analyze{display:grid;grid-template-columns:1fr auto;gap:8px}.result{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center}.bigscore{font-size:44px;font-weight:850}.small{font-size:11px;color:var(--muted)}
dialog{border:0;border-radius:15px;width:min(760px,calc(100% - 24px));padding:0;box-shadow:0 20px 60px rgba(0,0,0,.22)}dialog::backdrop{background:rgba(17,24,39,.45)}.modal{padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f3f4f6;border-radius:8px;width:34px;height:34px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}.result{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
@media(max-width:480px){.app{padding:12px}.grid{grid-template-columns:1fr 1fr}.analyze{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="logo">C</div><div><h1>CareerOS</h1><div class="sub">Job application command centre</div></div></div><button class="btn" id="settingsBtn">⚙ Settings</button></header>
<nav id="nav"></nav><div id="view"></div>
</main>
<dialog id="modal"><div class="modal" id="modalContent"></div></dialog>
<script>
const DEFAULT_COMPANIES=[
["HSBC","Global Bank"],["DBS","Global Bank"],["American Express","Global Bank"],["Bank of America","Global Bank"],["Citi","Global Bank"],["Standard Chartered","Global Bank"],["Deutsche Bank","Global Bank"],["Barclays","Global Bank"],["Goldman Sachs","Global Bank"],["JPMorgan","Global Bank"],
["Razorpay","Indian Fintech"],["PayU","Indian Fintech"],["Cashfree Payments","Indian Fintech"],["Pine Labs","Indian Fintech"],["Juspay","Indian Fintech"],["Poonawalla Fincorp","Indian Fintech"],["Jio Finance","Indian Fintech"],["Kiwi Credit Card","Indian Fintech"],["Kiwi Insurance","Indian Fintech"],["Fibe","Indian Fintech"],["Scapia","Indian Fintech"],["CRED","Indian Fintech"],["Groww","Indian Fintech"],["PhonePe","Indian Fintech"],["Jupiter","Indian Fintech"],["Navi","Indian Fintech"],["Slice","Indian Fintech"],["Fi Money","Indian Fintech"],["OneCard","Indian Fintech"],["Stripe","Global Fintech"],["Airwallex","Global Fintech"],["Mastercard","Payments"],["NPCI","Payments"],["Visa","Payments"],["BlackRock","Finance/Data"],["Motilal Oswal","Finance/Data"],["CRISIL","Finance/Data"],["ABFC","Finance/Data"],["Google","Big Tech"],["Adobe","Big Tech"],["Amazon","Big Tech"],["Flipkart","Big Tech"],["Meesho","Big Tech"]];
const state={tab:"dashboard",jobs:[],applications:[],companies:[],resumeLibrary:[],settings:{},backend:"",connected:false,loading:false,analysis:null};
const nav=[["dashboard","⌂ Dashboard"],["analyze","🔎 Analyze Job"],["applications","▣ Applications"],["companies","🏢 Companies"],["resume","📄 Resumes"]];
const statuses=["Saved","Preparing","Applied","Recruiter Screen","Interview","Final","Offer","Rejected","Withdrawn"];
function id(){return"c_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function fmtDate(v){if(!v)return"—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function saveLocal(){localStorage.setItem("careeros_state",JSON.stringify(state))}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem("careeros_state")||"null");if(x)Object.assign(state,x)}catch(e){}if(!state.settings)state.settings={};if(!Array.isArray(state.companies)||!state.companies.length)state.companies=DEFAULT_COMPANIES.map(([name,category])=>({id:id(),name,category,active:true,sourceUrl:"",ats:""}))}
function backendUrl(){return String(state.backend||"").trim().replace(/\/+$/,"")}function hasBackend(){return/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/i.test(backendUrl())}
async function api(action,payload={}){if(!hasBackend())return null;const q=new URLSearchParams({action});Object.entries(payload).forEach(([k,v])=>{if(v!==undefined&&v!==null)q.set(k,String(v))});const r=await fetch(backendUrl()+"?"+q,{cache:"no-store"});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));return d}
async function apiPost(action,payload={}){if(!hasBackend())return null;const b=new URLSearchParams({action});Object.entries(payload).forEach(([k,v])=>{if(v!==undefined&&v!==null)b.set(k,String(v))});const r=await fetch(backendUrl(),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:b,cache:"no-store"});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));return d}
function normalize(data){return{
jobs:(data.Jobs||[]).map(x=>({id:String(x.ID||id()),company:x.Company||"",title:x.Title||"",location:x.Location||"",url:x.URL||"",source:x.Source||"",dateFound:x.DateFound||"",match:x.Match===""?"":Number(x.Match),priority:x.Priority||"",jd:x.JD||"",status:x.Status||"Saved",notes:x.Notes||"",text:x.Text||""})),
applications:(data.Applications||[]).map(x=>({id:String(x.ID||id()),jobId:x.JobID||"",company:x.Company||"",title:x.Title||"",status:x.Status||"Saved",dateApplied:x.DateApplied||"",resumeId:x.ResumeID||"",recruiter:x.Recruiter||"",nextAction:x.NextAction||"",followUpDate:x.FollowUpDate||"",notes:x.Notes||"",text:x.Text||""})),
companies:(data.Companies||[]).map(x=>({id:String(x.ID||id()),name:x.Name||"",category:x.Category||"",ats:x.ATS||"",sourceUrl:x.SourceURL||"",active:String(x.Active).toLowerCase()!=="false",lastChecked:x.LastChecked||"",notes:x.Notes||"",text:x.Text||""})),
resumeLibrary:(data.ResumeLibrary||[]).map(x=>({id:String(x.ID||id()),name:x.Name||"",type:x.Type||"Resume",fileId:x.FileId||"",fileUrl:x.FileURL||"",mimeType:x.MimeType||"",size:Number(x.Size||0),targetRole:x.TargetRole||"",targetCompany:x.TargetCompany||"",createdAt:x.CreatedAt||"",updatedAt:x.UpdatedAt||"",notes:x.Notes||"",text:x.Text||""}))
}}
async function sync(){if(!hasBackend())return false;try{const d=normalize(await api("fetchAll"));Object.assign(state,d,{connected:true});saveLocal();render();return true}catch(e){state.connected=false;console.error(e);return false}}
async function saveRec(sheet,r){try{await api("save",Object.assign({sheet},r));return true}catch(e){console.error(e);return false}}
async function deleteRec(sheet,rid){try{const d=await api("delete",{sheet,id:rid});return!!d?.ok}catch(e){console.error(e);return false}}
function badge(){return state.connected?'<span class="badge">● Google Sheets connected</span>':'<span class="badge">Local / not connected</span>'}
function scoreClass(n){return n>=85?"high":n>=70?"mid":"low"}
function renderNav(){document.getElementById("nav").innerHTML=nav.map(([k,t])=>`<button class="${state.tab===k?"active":""}" data-tab="${k}">${t}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()})}
const views={
dashboard(){const active=state.applications.filter(a=>!["Rejected","Withdrawn","Offer"].includes(a.status)).length;const interviews=state.applications.filter(a=>["Interview","Final"].includes(a.status)).length;return`<div class="notice">${badge()} &nbsp; Paste a job link to analyze it, then apply and let Gmail update the application later.</div><div class="grid"><div class="card metric"><div class="label">Applications</div><div class="value">${state.applications.length}</div></div><div class="card metric"><div class="label">Active</div><div class="value">${active}</div></div><div class="card metric"><div class="label">Interviews</div><div class="value">${interviews}</div></div><div class="card metric"><div class="label">Resumes</div><div class="value">${state.resumeLibrary.length}</div></div></div><section class="section"><div class="section-head"><h2>Start here</h2><button class="btn primary" data-action="analyzePage">+ Analyze job</button></div><div class="card"><b>Found a job?</b><div class="meta">Paste the job URL. CareerOS will try to read the JD and rank your resume library.</div></div></section><section class="section"><div class="section-head"><h2>Recent applications</h2><button class="btn" data-action="goApps">View all</button></div>${state.applications.slice(0,5).map(appCard).join("")||'<div class="empty">No applications yet.</div>'}</section>`},
analyze(){const a=state.analysis;return`<div class="card"><div class="section-head"><h2>Analyze a job</h2></div><div class="analyze"><input class="input" id="jobUrl" placeholder="Paste job link here…" value="${esc(a?.url||"")}"><button class="btn primary" data-action="analyze">Analyze</button></div><div class="meta">CareerOS will try to fetch the job page. If the site blocks access, you can paste the JD as a fallback.</div></div>${a?analysisView(a):""}`},
applications(){return`<div class="toolbar"><button class="btn primary" data-action="addApplication">+ Add application</button><button class="btn" data-action="sync">↻ Sync Sheet</button><button class="btn" data-action="gmail">✉ Sync Gmail</button></div><div class="list">${state.applications.map(appCard).join("")||'<div class="empty">No applications yet.</div>'}</div>`},
companies(){return`<div class="toolbar"><input class="input" id="companySearch" placeholder="Search companies…"><button class="btn" data-action="sync">↻ Sync</button></div><div class="list" id="companyList">${state.companies.map(companyCard).join("")}</div>`},
resume(){return`<div class="notice">Upload your real resume versions here. CareerOS uses this library when ranking a job.</div><div class="card"><div class="section-head"><h2>Resume Library</h2><button class="btn primary" data-action="upload">+ Upload</button></div>${state.resumeLibrary.map(doc=>`<div class="card row" style="margin-top:10px"><div><div class="title">${esc(doc.name)}</div><div class="company">${esc(doc.type)}${doc.targetRole?" · "+esc(doc.targetRole):""}${doc.targetCompany?" · "+esc(doc.targetCompany):""}</div><div class="meta">${doc.createdAt?"Added "+fmtDate(doc.createdAt):""}</div></div><div class="actions">${doc.fileUrl?`<a class="btn" href="${esc(doc.fileUrl)}" target="_blank" rel="noopener">Open ↗</a>`:""}<button class="btn danger" data-action="deleteResume" data-id="${esc(doc.id)}">Delete</button></div></div>`).join("")||'<div class="empty">Upload your first resume.</div>'}</div>`}
};
function appCard(a){return`<div class="card row"><div><div class="title">${esc(a.title||"Untitled")}</div><div class="company">${esc(a.company||"")}</div><div class="meta">${esc(a.status)}${a.dateApplied?" · Applied "+fmtDate(a.dateApplied):""}${a.followUpDate?" · Follow-up "+fmtDate(a.followUpDate):""}</div></div><div class="actions"><button class="btn" data-action="editApp" data-id="${a.id}">Open</button></div></div>`}
function companyCard(c){return`<div class="card row"><div><div class="title">${esc(c.name)}</div><div class="company">${esc(c.category||"")}</div></div><div class="actions">${c.sourceUrl?`<a class="btn primary" href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">Careers ↗</a>`:""}<button class="btn" data-action="editCompany" data-id="${c.id}">Edit</button></div></div>`}
function analysisView(a){if(a.needsJdPaste)return`<div class="card section"><h2>Paste JD</h2><div class="notice">${esc(a.error)}</div><textarea class="input" id="fallbackJd" style="min-height:260px" placeholder="Paste the job description here…"></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" data-action="analyzePasted">Analyze pasted JD</button></div></div>`;const best=a.bestResume;return`<div class="card section"><div class="result"><div><div class="small">JOB MATCH</div><div class="bigscore ${scoreClass(+a.match)}">${a.match}%</div></div><div><div class="title">${esc(best?.name||"No resume found")}</div><div class="company">Best fitted resume</div><p>${esc(a.recommendation||"")}</p><div class="actions">${best?`<button class="btn primary" data-action="createApplication" data-id="${esc(best.id)}">Apply / track</button>`:""}<a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Open job ↗</a></div></div></div></div><div class="card section"><b>How to read this</b><div class="meta">${esc(a.note||"")}</div></div>`}
function openModal(title,body){document.getElementById("modalContent").innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></div>${body}`;const d=document.getElementById("modal");d.showModal();document.getElementById("closeModal").onclick=()=>d.close()}
const actions={
async sync(){const ok=await sync();if(!ok)alert("Sync failed. Check your Apps Script /exec URL.")},async gmail(){if(!hasBackend())return alert("Connect the backend first.");try{const d=await api("syncGmail");await sync();alert(d.message||"Gmail sync complete.")}catch(e){alert("Gmail sync failed: "+e.message)}},
analyzePage(){state.tab="analyze";render()},
async analyze(){const url=document.getElementById("jobUrl")?.value.trim();if(!url)return alert("Paste a job URL first.");if(!hasBackend())return alert("Connect the Apps Script backend in Settings first.");openModal("Analyzing job","<div class='notice'>Reading the job page and ranking your resume library…</div>");try{const a=await api("analyzeJob",{url});document.getElementById("modal").close();state.analysis=a;state.tab="analyze";render()}catch(e){document.getElementById("modal").close();alert(e.message)}},
async analyzePasted(){const jd=document.getElementById("fallbackJd")?.value.trim();const url=state.analysis?.url||document.getElementById("jobUrl")?.value.trim();if(!jd)return alert("Paste the JD first.");if(!hasBackend())return alert("Connect the backend first.");try{const a=await apiPost("analyzePastedJob",{url,jd});state.analysis=a;render()}catch(e){alert(e.message)}},
async createApplication(resumeId){const a=state.analysis;if(!a)return;openModal("Track application",`<form class="form" id="newApp"><div class="form-row"><label>Company<input class="input" name="company" value="${esc(a.company||"")}" required></label><label>Role<input class="input" name="title" value="${esc(a.title||"")}" required></label></div><label>Status<select class="input" name="status">${statuses.map(s=>`<option ${s==="Applied"?"selected":""}>${s}</option>`).join("")}</select></label><label>Job URL<input class="input" name="url" value="${esc(a.url||"")}"></label><button class="btn primary">Save application</button></form>`);document.getElementById("newApp").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r={id:id(),jobId:"",company:f.company,title:f.title,status:f.status,dateApplied:f.status==="Applied"?new Date().toISOString():"",resumeId:resumeId||"",recruiter:"",nextAction:"",followUpDate:"",notes:""};state.applications.unshift(r);await saveRec("Applications",r);document.getElementById("modal").close();state.tab="applications";render()}},
async addApplication(){openModal("Add application",`<form class="form" id="appForm"><div class="form-row"><label>Company<input class="input" name="company" required></label><label>Role<input class="input" name="title" required></label></div><label>Status<select class="input" name="status">${statuses.map(s=>`<option>${s}</option>`).join("")}</select></label><label>Job URL<input class="input" name="url"></label><label>Notes<textarea class="input" name="notes"></textarea></label><button class="btn primary">Save</button></form>`);document.getElementById("appForm").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r={id:id(),jobId:"",company:f.company,title:f.title,status:f.status,dateApplied:f.status==="Applied"?new Date().toISOString():"",resumeId:"",recruiter:"",nextAction:"",followUpDate:"",notes:f.notes||""};state.applications.unshift(r);await saveRec("Applications",r);document.getElementById("modal").close();render()}},
async editApp(rid){const a=state.applications.find(x=>x.id===rid);if(!a)return;openModal("Application",`<form class="form" id="editApp"><div class="form-row"><label>Company<input class="input" name="company" value="${esc(a.company)}" required></label><label>Role<input class="input" name="title" value="${esc(a.title)}" required></label></div><label>Status<select class="input" name="status">${statuses.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></label><label>Follow-up date<input class="input" name="followUpDate" type="date" value="${esc(a.followUpDate?String(a.followUpDate).slice(0,10):"")}"></label><label>Notes<textarea class="input" name="notes">${esc(a.notes||"")}</textarea></label><div class="actions"><button class="btn primary">Save</button><button class="btn danger" type="button" data-action="deleteApp" data-id="${a.id}">Delete application</button></div></form>`);document.getElementById("editApp").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));Object.assign(a,{company:f.company,title:f.title,status:f.status,followUpDate:f.followUpDate,notes:f.notes});if(a.status==="Applied"&&!a.dateApplied)a.dateApplied=new Date().toISOString();await saveRec("Applications",a);document.getElementById("modal").close();render()}},
async deleteApp(rid){if(!confirm("Delete this application permanently?"))return;const ok=await deleteRec("Applications",rid);if(!ok)return alert("Delete failed. Please check the backend.");state.applications=state.applications.filter(a=>a.id!==rid);document.getElementById("modal").close();render()},
async upload(){if(!hasBackend())return alert("Connect the backend first.");openModal("Upload resume",`<form class="form" id="upload"><label>File<input class="input" type="file" name="file" accept=".pdf,.doc,.docx,.txt" required></label><div class="form-row"><label>Type<select class="input" name="type"><option>Resume</option><option>Cover Letter</option><option>Portfolio</option><option>Other</option></select></label><label>Target role<input class="input" name="targetRole"></label></div><label>Target company<input class="input" name="targetCompany"></label><label>Notes<textarea class="input" name="notes"></textarea></label><div class="notice">For accurate V1 matching, TXT resumes can be scored from their text. PDF/DOCX text extraction can be added next; metadata is still used for ranking.</div><button class="btn primary">Upload</button></form>`);document.getElementById("upload").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get("file");if(!file||file.size>5*1024*1024)return alert("Please use a file up to 5 MB.");const reader=new FileReader();reader.onload=async()=>{try{const base64=String(reader.result).split(",")[1]||"";let resumeText="";if(/\.txt$/i.test(file.name)){resumeText=await file.text()}const d=await apiPost("uploadResumeFile",{name:file.name,mimeType:file.type,base64,type:f.get("type"),targetRole:f.get("targetRole"),targetCompany:f.get("targetCompany"),notes:f.get("notes"),resumeText});state.resumeLibrary.unshift(d.record);document.getElementById("modal").close();render()}catch(err){alert(err.message)}};reader.readAsDataURL(file)}},
async deleteResume(rid){if(!confirm("Delete this resume/document?"))return;const ok=await deleteRec("ResumeLibrary",rid);if(!ok){try{const d=await api("deleteResumeFile",{id:rid});if(!d?.ok)return alert("Delete failed.")}catch(e){return alert("Delete failed: "+e.message)}}state.resumeLibrary=state.resumeLibrary.filter(x=>x.id!==rid);saveLocal();render()},
async editCompany(cid){const c=state.companies.find(x=>x.id===cid);if(!c)return;openModal("Company",`<form class="form" id="cf"><label>Company<input class="input" name="name" value="${esc(c.name)}"></label><label>Careers URL<input class="input" name="sourceUrl" value="${esc(c.sourceUrl||"")}"></label><label>ATS<input class="input" name="ats" value="${esc(c.ats||"")}"></label><button class="btn primary">Save</button></form>`);document.getElementById("cf").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));Object.assign(c,f);await saveRec("Companies",c);document.getElementById("modal").close();render()}},
goApps(){state.tab="applications";render()}
};
function bind(){document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>actions[b.dataset.action]?.(b.dataset.id));const s=document.getElementById("companySearch");if(s)s.oninput=()=>{const q=s.value.toLowerCase();document.getElementById("companyList").innerHTML=state.companies.filter(c=>(c.name+" "+c.category).toLowerCase().includes(q)).map(companyCard).join("") ;bind()}}
function render(){renderNav();document.getElementById("view").innerHTML=views[state.tab]();bind()}
document.getElementById("settingsBtn").onclick=()=>{openModal("Settings",`<form class="form" id="settings"><label>Apps Script /exec URL<input class="input" name="backend" value="${esc(state.backend)}" placeholder="https://script.google.com/macros/s/.../exec"></label><button class="btn primary">Save & connect</button></form>`);document.getElementById("settings").onsubmit=async e=>{e.preventDefault();state.backend=String(new FormData(e.target).get("backend")||"").trim();saveLocal();document.getElementById("modal").close();const ok=await sync();alert(ok?"Connected.":"Could not connect.")}}
loadLocal();render();if(hasBackend())sync();
</script>
</body>
</html>
