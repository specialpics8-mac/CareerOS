<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerOS</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#111827;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1180px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.brand{font-weight:850;font-size:23px}.sub{font-size:12px;color:var(--muted);font-weight:500}nav{display:flex;gap:6px;overflow:auto;margin-bottom:15px}nav button,button,.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 11px;cursor:pointer;color:inherit;text-decoration:none}nav button.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:10px}.metric .muted{font-size:12px}.metric b{display:block;font-size:28px;margin-top:4px}.muted{color:var(--muted);font-size:12px}.section{margin-top:15px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions,.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.title{font-weight:750}.company{color:var(--muted);margin-top:3px}.badge{display:inline-block;padding:4px 7px;background:#f3f4f6;border-radius:7px;font-size:11px}.score{font-size:46px;font-weight:900}.high{color:var(--green)}.mid{color:var(--amber)}.low{color:var(--red)}.empty{text-align:center;padding:28px;border:1px dashed var(--border);border-radius:10px;color:var(--muted)}
.input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}textarea{min-height:190px}.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:11px 12px;background:#eff6ff;color:#1e40af;border-radius:9px;font-size:12px;margin-bottom:10px}.ok{background:#f0fdf4;color:var(--green)}.warn{background:#fffbeb;color:var(--amber)}
dialog{border:0;border-radius:12px;width:min(760px,calc(100% - 20px));padding:0;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0006}.modal{padding:18px}.close{float:right}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<header><div><div class="brand">CareerOS</div><div class="sub">Find → Match → Apply → Track</div></div><button id="settingsBtn">⚙ Settings</button></header>
<nav id="nav"></nav><div id="view"></div>
</main>
<dialog id="dlg"><div class="modal" id="modal"></div></dialog>
<script>
const tabs=[["dashboard","Dashboard"],["analyze","Analyze Job"],["applications","Applications"],["companies","Companies"],["resumes","Resumes"],["gmail","Gmail"]];
const S={tab:"dashboard",backend:localStorage.careerOSBackend||"",applications:[],companies:[],resumes:[],analysis:null,gmail:null};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():"c"+Date.now()+Math.random().toString(36).slice(2,8);
function apiUrl(){return S.backend.replace(/\/+$/,"")}function connected(){return/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(apiUrl())}
async function api(a,p={}){if(!connected())throw Error("Connect the Apps Script /exec URL in Settings.");const q=new URLSearchParams({action:a});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const r=await fetch(apiUrl()+"?"+q,{cache:"no-store"});const d=await r.json();if(d.error)throw Error(d.error);return d}
async function post(a,p={}){if(!connected())throw Error("Connect the Apps Script /exec URL in Settings.");const q=new URLSearchParams({action:a});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const r=await fetch(apiUrl(),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:q,cache:"no-store"});const d=await r.json();if(d.error)throw Error(d.error);return d}
async function syncAll(){
  if(!connected()) return false;
  try{
    const d0=await api("fetchAll");
    let d=d0;

    if(!(d.Companies||[]).length){
      try{
        await api("seedCompanies");
        d=await api("fetchAll");
      }catch(e){}
    }

    S.applications=(d.Applications||[]).map(x=>({id:x.ID,company:x.Company||"",title:x.Title||"",status:x.Status||"Saved",dateApplied:x.DateApplied||"",resumeId:x.ResumeID||"",followUpDate:x.FollowUpDate||"",notes:x.Notes||"",url:x.URL||""}));
    S.companies=(d.Companies||[]).map(x=>({id:x.ID,name:x.Name||"",category:x.Category||"",sourceUrl:x.SourceURL||"",ats:x.ATS||"",active:String(x.Active).toLowerCase()!=="false"}));
    S.resumes=(d.ResumeLibrary||[]).map(x=>({id:x.ID,name:x.Name||"",type:x.Type||"Resume",fileUrl:x.FileURL||"",targetRole:x.TargetRole||"",targetCompany:x.TargetCompany||"",createdAt:x.CreatedAt||""}));

    try{const gs=await api("getGmailStatus");S.gmail=gs.account||"";}catch(e){}
    localStorage.careerOSCache=JSON.stringify({applications:S.applications,companies:S.companies,resumes:S.resumes,gmail:S.gmail});
    render();
    return true;
  }catch(e){
    console.error(e);
    throw e;
  }
};
function appCard(a){return`<div class=card><div class=row><div><div class=title>${esc(a.title)}</div><div class=company>${esc(a.company)}</div><div class=muted><span class=badge>${esc(a.status)}</span>${a.dateApplied?" · "+new Date(a.dateApplied).toLocaleDateString("en-IN"):""}${a.followUpDate?" · Follow-up "+esc(a.followUpDate):""}</div></div><div class=actions><button onclick="editApp('${a.id}')">Open</button></div></div></div>`}
function companyCard(c){return`<div class=card><div class=row><div><div class=title>${esc(c.name)}</div><div class=company">${esc(c.category||"")}</div></div><div class=actions>${c.sourceUrl?`<a class="btn primary" href="${esc(c.sourceUrl)}" target=_blank>Careers ↗</a>`:""}<button onclick="editCompany('${c.id}')">Edit</button></div></div></div>`}
function analysisCard(a){if(a.needsJdPaste)return`<div class=card><b>Paste JD</b><p class=muted>${esc(a.error)}</p><textarea id=fallbackJd class=input placeholder="Paste the full job description…"></textarea><button class=primary onclick=pasteAnalyze()>Analyze pasted JD</button></div>`;const b=a.bestResume;return`<div class=card><div class=muted>BEST RESUME MATCH</div><div class="score ${scoreClass(+a.match)}">${a.match}%</div><div class=title>${esc(b?.name||"No resume")}</div><div class=company>${esc(a.recommendation||"")}</div><div class=actions style="margin-top:10px">${b?`<button class=primary onclick="createApp('${b.id}')">Track application</button>`:""}<a class=btn href="${esc(a.url)}" target=_blank>Open job ↗</a></div><div class=muted style="margin-top:10px">${esc(a.reliability||"")}</div></div>`}
async function analyze(){try{const u=document.getElementById("jobUrl").value.trim();if(!u)return alert("Paste a job URL first.");S.analysis=await api("analyzeJob",{url:u});render()}catch(e){alert(e.message)}}
async function pasteAnalyze(){try{S.analysis=await post("analyzePastedJob",{url:S.analysis?.url||document.getElementById("jobUrl").value,jd:document.getElementById("fallbackJd").value});render()}catch(e){alert(e.message)}}
async function createApp(rid){const a=S.analysis;open("Track application",`<form class=form id=appForm><div class=two><label>Company<input class=input name=company value="${esc(a.company||"")}" required></label><label>Role<input class=input name=title value="${esc(a.title||"")}" required></label></div><label>Status<select class=input name=status><option>Applied</option><option>Saved</option><option>Recruiter Screen</option><option>Interview</option><option>Final</option><option>Offer</option><option>Rejected</option></select></label><label>Job URL<input class=input name=url value="${esc(a.url||"")}"></label><button class=primary>Save application</button></form>`);appForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(appForm),r={id:uid(),jobId:"",company:f.get("company"),title:f.get("title"),status:f.get("status"),dateApplied:f.get("status")==="Applied"?new Date().toISOString():"",resumeId:rid,recruiter:"",nextAction:"",followUpDate:"",notes:""};try{await saveApplication(r);dlg.close();S.tab="applications";render()}catch(x){alert(x.message)}}}
async function saveApplication(r){await post("saveApplication",r);S.applications.unshift(r)}
async function addApp(){open("Add application",`<form class=form id=addAppForm><div class=two><label>Company<input class=input name=company required></label><label>Role<input class=input name=title required></label></div><label>Status<select class=input name=status><option>Applied</option><option>Saved</option><option>Recruiter Screen</option><option>Interview</option><option>Final</option><option>Offer</option><option>Rejected</option><option>Withdrawn</option></select></label><label>Job URL<input class=input name=url></label><button class=primary>Save</button></form>`);addAppForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(addAppForm),r={id:uid(),jobId:"",company:f.get("company"),title:f.get("title"),status:f.get("status"),dateApplied:f.get("status")==="Applied"?new Date().toISOString():"",resumeId:"",recruiter:"",nextAction:"",followUpDate:"",notes:""};try{await saveApplication(r);dlg.close();render()}catch(x){alert(x.message)}}}
async function editApp(id){const a=S.applications.find(x=>x.id===id);open("Application",`<form class=form id=editAppForm><div class=two><label>Company<input class=input name=company value="${esc(a.company)}"></label><label>Role<input class=input name=title value="${esc(a.title)}"></label></div><label>Status<select class=input name=status>${["Saved","Preparing","Applied","Recruiter Screen","Interview","Final","Offer","Rejected","Withdrawn"].map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></label><label>Follow-up<input class=input type=date name=followUpDate value="${esc(String(a.followUpDate||"").slice(0,10))}"></label><label>Notes<textarea class=input name=notes>${esc(a.notes||"")}</textarea></label><div class=actions><button class=primary>Save</button><button type=button onclick="deleteApp('${id}')">Delete application</button></div></form>`);editAppForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(editAppForm);Object.assign(a,{company:f.get("company"),title:f.get("title"),status:f.get("status"),followUpDate:f.get("followUpDate"),notes:f.get("notes")});try{await post("save",Object.assign({sheet:"Applications"},a));dlg.close();render()}catch(x){alert(x.message)}}}
async function deleteApp(id){if(!confirm("Delete this application permanently?"))return;try{const d=await api("deleteApplicationFast",{id});if(!d.ok)throw Error(d.error||"Delete failed");S.applications=S.applications.filter(a=>a.id!==id);dlg.close();render()}catch(e){alert("Delete failed: "+e.message)}}
async function uploadResume(){open("Upload resume",`<form class=form id=resumeForm><input class=input type=file name=file accept=".pdf,.doc,.docx,.txt" required><div class=two><input class=input name=targetRole placeholder="Target role"><input class=input name=targetCompany placeholder="Target company"></div><button class=primary>Upload</button></form>`);resumeForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(resumeForm),file=f.get("file");if(!file||file.size>5*1024*1024)return alert("Use a file up to 5 MB.");const rd=new FileReader();rd.onload=async()=>{try{const d=await post("uploadResumeFile",{name:file.name,mimeType:file.type,base64:String(rd.result).split(",")[1],type:"Resume",targetRole:f.get("targetRole"),targetCompany:f.get("targetCompany"),notes:""});S.resumes.unshift({id:d.record.ID,name:d.record.Name,type:d.record.Type,fileUrl:d.record.FileURL,targetRole:d.record.TargetRole,targetCompany:d.record.TargetCompany,createdAt:d.record.CreatedAt});dlg.close();render()}catch(x){alert(x.message)}};rd.readAsDataURL(file)}}
async function deleteResume(id){if(!confirm("Delete this resume?"))return;try{const d=await api("deleteResumeFile",{id});if(!d.ok)throw Error(d.error||"Delete failed");S.resumes=S.resumes.filter(r=>r.id!==id);render()}catch(e){alert("Delete failed: "+e.message)}}
async function addCompany(){open("Add company",`<form class=form id=companyForm><div class=two><label>Company<input class=input name=name required></label><label>Category<input class=input name=category placeholder="Fintech / Global Bank / Tech"></label></div><label>Careers URL<input class=input name=sourceUrl type=url placeholder="https://…"></label><label>ATS<input class=input name=ats placeholder="Greenhouse / Lever / Workday / Custom"></label><button class=primary>Save company</button></form>`);companyForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(companyForm),c={id:uid(),name:f.get("name"),category:f.get("category"),sourceUrl:f.get("sourceUrl"),ats:f.get("ats"),active:true,lastChecked:"",notes:""};try{await post("save",Object.assign({sheet:"Companies"},c));S.companies.push(c);dlg.close();render()}catch(x){alert(x.message)}}}
async function editCompany(id){const c=S.companies.find(x=>x.id===id);open("Company",`<form class=form id=editCompanyForm><label>Company<input class=input name=name value="${esc(c.name)}"></label><label>Category<input class=input name=category value="${esc(c.category)}"></label><label>Careers URL<input class=input name=sourceUrl value="${esc(c.sourceUrl)}"></label><label>ATS<input class=input name=ats value="${esc(c.ats)}"></label><button class=primary>Save</button></form>`);editCompanyForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(editCompanyForm);Object.assign(c,{name:f.get("name"),category:f.get("category"),sourceUrl:f.get("sourceUrl"),ats:f.get("ats")});try{await post("save",Object.assign({sheet:"Companies"},c));dlg.close();render()}catch(x){alert(x.message)}}}
function filterCompanies(){const q=(document.getElementById("companySearch")?.value||"").toLowerCase();document.getElementById("companyList").innerHTML=S.companies.filter(c=>(c.name+" "+c.category).toLowerCase().includes(q)).map(companyCard).join("")||'<div class=empty>No matching companies.</div>'}
async function syncGmail(){try{if(!connected())return alert("Connect Apps Script first.");if(S.gmail&&S.gmail.toLowerCase()!=="vishalnihalani2@gmail.com")return alert("This deployment is running as "+S.gmail+". Please use the CareerOS Apps Script owned by vishalnihalani2@gmail.com.");const d=await api("syncGmail");S.gmail=d.account;alert(`Gmail sync complete.\nMessages processed: ${d.messagesProcessed}\nApplications matched: ${d.applicationsMatched}\nApplications updated: ${d.applicationsUpdated}`);await syncAll();S.tab="gmail";render()}catch(e){alert("Gmail sync failed: "+e.message)}}
settingsBtn.onclick=()=>{open("Settings",`<form class=form id=settingsForm><label>Apps Script /exec URL<input class=input name=url value="${esc(S.backend)}"></label><div class=muted>CareerOS V1 uses one mailbox: vishalnihalani2@gmail.com.</div><button class=primary>Save & connect</button></form>`);settingsForm.onsubmit=async e=>{e.preventDefault();S.backend=settingsForm.url.value.trim();localStorage.careerOSBackend=S.backend;dlg.close();try{await syncAll()}catch(x){alert(x.message)}}}
function render(){navRender();view.innerHTML=V[S.tab]();if(S.tab==="gmail"&&S.gmail)document.getElementById("gmailEvents").innerHTML=`<div class=card><b>Connected mailbox</b><div class=muted>${esc(S.gmail)}</div><div class=muted style="margin-top:6px">Gmail sync is incremental: it checks only a bounded recent window and remembers the last successful sync.</div></div>`; }
loadCache();render();if(connected())syncAll().catch(e=>console.warn(e));
</script>
</body>
</html>
