<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerOS</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;
  --border:#e5e7eb;--primary:#111827;--blue:#2563eb;
  --green:#15803d;--amber:#b45309;--red:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1180px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.brand-wrap{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
.brand{font-size:22px;font-weight:850;line-height:1.1}.sub{font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;overflow:auto;padding-bottom:2px;margin-bottom:16px}
nav button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:9px;white-space:nowrap}
nav button.active{background:var(--primary);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric .label{font-size:12px;color:var(--muted)}.metric .value{font-size:28px;font-weight:850;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-weight:750}.muted{font-size:12px;color:var(--muted);margin-top:3px}
.actions,.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:12px}
button,.btn{border:1px solid var(--border);background:#fff;color:inherit;border-radius:8px;padding:9px 11px;cursor:pointer;text-decoration:none}
button.primary,.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.dark{background:var(--primary);border-color:var(--primary);color:#fff}
button.danger{color:var(--red)}
button:disabled{opacity:.55;cursor:not-allowed}
.input,textarea,select{width:100%;font:inherit;border:1px solid var(--border);border-radius:8px;padding:10px;background:#fff}
textarea{min-height:180px;resize:vertical}
.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{padding:11px 12px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:12px;margin-bottom:12px}
.notice.success{background:#f0fdf4;color:var(--green)}.notice.warn{background:#fffbeb;color:var(--amber)}
.empty{padding:28px;text-align:center;border:1px dashed var(--border);border-radius:11px;color:var(--muted)}
.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#f3f4f6;font-size:11px}
.score{font-size:46px;font-weight:900}.score.high{color:var(--green)}.score.mid{color:var(--amber)}.score.low{color:var(--red)}
.section{margin-top:16px}.small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #d1d5db;border-top-color:#111827;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
dialog{border:0;border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0006}.modal{padding:18px}.close{float:right;background:#f3f4f6;border:0}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="brand-wrap">
    <div class="logo">C</div>
    <div><div class="brand">CareerOS</div><div class="sub">Find → Match → Apply → Track</div></div>
  </div>
  <button id="settingsBtn">⚙ Settings</button>
</header>
<nav id="nav"></nav>
<div id="view"></div>
</main>

<dialog id="dialog">
  <div class="modal" id="modalContent"></div>
</dialog>

<script>
"use strict";

const TABS = [
  ["dashboard","Dashboard"],
  ["analyze","Analyze Job"],
  ["applications","Applications"],
  ["companies","Companies"],
  ["resumes","Resumes"],
  ["gmail","Gmail"]
];

const STATUSES = [
  "Saved","Preparing","Applied","Recruiter Screen","Interview",
  "Final","Offer","Rejected","Withdrawn"
];

const state = {
  tab:"dashboard",
  backend:localStorage.getItem("careeros_backend") || "",
  applications:[],
  companies:[],
  resumes:[],
  gmailAccount:"",
  analysis:null,
  busy:false
};

function $(id){ return document.getElementById(id); }
function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "c_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}
function backendReady(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(
    String(state.backend || "").trim()
  );
}
function apiUrl(){ return String(state.backend || "").trim().replace(/\/+$/,""); }

async function api(action, payload){
  payload = payload || {};
  if(!backendReady()) throw new Error("Connect your CareerOS Apps Script /exec URL in Settings.");
  const q = new URLSearchParams({action:action});
  Object.keys(payload).forEach(function(k){ q.set(k,String(payload[k])); });
  const r = await fetch(apiUrl()+"?"+q.toString(),{cache:"no-store"});
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); }
  catch(e){ throw new Error("Backend returned an invalid response."); }
  if(!r.ok || data.error) throw new Error(data.error || ("HTTP "+r.status));
  return data;
}

async function post(action,payload){
  payload = payload || {};
  if(!backendReady()) throw new Error("Connect your CareerOS Apps Script /exec URL in Settings.");
  const q = new URLSearchParams({action:action});
  Object.keys(payload).forEach(function(k){ q.set(k,String(payload[k])); });
  const r = await fetch(apiUrl(),{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:q.toString(),
    cache:"no-store"
  });
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); }
  catch(e){ throw new Error("Backend returned an invalid response."); }
  if(!r.ok || data.error) throw new Error(data.error || ("HTTP "+r.status));
  return data;
}

function saveCache(){
  localStorage.setItem("careeros_cache",JSON.stringify({
    applications:state.applications,
    companies:state.companies,
    resumes:state.resumes,
    gmailAccount:state.gmailAccount
  }));
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem("careeros_cache")||"null");
    if(!c) return;
    state.applications=Array.isArray(c.applications)?c.applications:[];
    state.companies=Array.isArray(c.companies)?c.companies:[];
    state.resumes=Array.isArray(c.resumes)?c.resumes:[];
    state.gmailAccount=c.gmailAccount||"";
  }catch(e){}
}
function renderNav(){
  $("nav").innerHTML=TABS.map(function(t){
    return '<button class="'+(state.tab===t[0]?"active":"")+'" data-tab="'+esc(t[0])+'">'+esc(t[1])+'</button>';
  }).join("");
  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.addEventListener("click",function(){state.tab=b.dataset.tab;render();});
  });
}
function render(){
  renderNav();
  const views = {
    dashboard:viewDashboard,
    analyze:viewAnalyze,
    applications:viewApplications,
    companies:viewCompanies,
    resumes:viewResumes,
    gmail:viewGmail
  };
  $("view").innerHTML=views[state.tab]();
  bindEvents();
}
function scoreClass(n){ return n>=85?"high":(n>=70?"mid":"low"); }
function dateText(v){
  if(!v) return "";
  const d=new Date(v);
  if(isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}

function viewDashboard(){
  const active=state.applications.filter(function(a){
    return ["Rejected","Withdrawn","Offer"].indexOf(a.status)===-1;
  }).length;
  const interviews=state.applications.filter(function(a){
    return ["Interview","Final"].indexOf(a.status)>=0;
  }).length;
  return `
    <div class="notice ${backendReady()?"success":"warn"}">
      ${backendReady()?"● CareerOS backend connected":"○ Connect your Apps Script backend in Settings"}
    </div>
    <div class="grid">
      <div class="card metric"><div class="label">Applications</div><div class="value">${state.applications.length}</div></div>
      <div class="card metric"><div class="label">Active</div><div class="value">${active}</div></div>
      <div class="card metric"><div class="label">Interviews</div><div class="value">${interviews}</div></div>
      <div class="card metric"><div class="label">Resume versions</div><div class="value">${state.resumes.length}</div></div>
    </div>
    <section class="section">
      <div class="card">
        <div class="title">Start with a job</div>
        <div class="muted">Paste a job link → get a match → choose the best resume → track the application.</div>
        <div class="actions" style="margin-top:10px">
          <button class="primary" data-go="analyze">Analyze Job</button>
          <button data-go="companies">Companies</button>
          <button data-go="applications">Applications</button>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="row"><div class="title">Recent applications</div><button data-go="applications">View all</button></div>
      <div style="margin-top:10px">
        ${state.applications.slice(0,6).map(applicationCard).join("") || '<div class="empty">No applications yet.</div>'}
      </div>
    </section>
  `;
}

function viewAnalyze(){
  const a=state.analysis;
  return `
    <div class="card">
      <div class="title">Analyze a job</div>
      <div class="toolbar" style="margin-top:10px">
        <input id="jobUrl" class="input" placeholder="Paste the job link…" value="${esc(a && a.url || "")}">
        <button class="primary" id="analyzeBtn">Analyze</button>
      </div>
      <div class="muted">CareerOS tries to read the job page. If the site blocks access, you can paste the JD.</div>
    </div>
    ${a ? analysisView(a) : ""}
  `;
}
function analysisView(a){
  if(a.needsJdPaste){
    return `
      <div class="card">
        <div class="title">Paste the JD</div>
        <div class="notice warn" style="margin-top:10px">${esc(a.error||"Paste the job description.")}</div>
        <textarea id="fallbackJd" class="input" placeholder="Paste the full job description here…"></textarea>
        <button class="primary" id="pasteAnalyzeBtn" style="margin-top:10px">Analyze pasted JD</button>
      </div>
    `;
  }

  const ranked=Array.isArray(a.resumes)?a.resumes:[];
  const best=a.bestResume;
  const rows=ranked.map(function(r,i){
    const isBest=best&&r.id===best.id;
    return `
      <div class="card" style="${isBest?'border:2px solid #111827;':''}">
        <div class="row">
          <div>
            <div class="title">${i+1}. ${esc(r.name)} ${isBest?'<span class="badge">Best fit</span>':""}</div>
            <div class="muted">${esc(r.targetRole||"")}${r.targetCompany?" · "+esc(r.targetCompany):""}</div>
          </div>
          <div class="score ${scoreClass(Number(r.score||0))}" style="font-size:30px">${Number(r.score||0)}%</div>
        </div>
        ${r.gaps&&r.gaps.length?'<div class="muted" style="margin-top:7px"><b>Potential gaps:</b> '+esc(r.gaps.join(" • "))+'</div>':""}
        ${r.indexError?'<div class="notice warn" style="margin-top:8px">'+esc(r.indexError)+'</div>':""}
      </div>
    `;
  }).join("");

  return `
    <div class="card">
      <div class="small">Best resume match</div>
      <div class="score ${scoreClass(Number(a.match||0))}">${Number(a.match||0)}%</div>
      <div class="title">${esc(best && best.name || "No resume selected")}</div>
      <div class="muted">${esc(a.recommendation||"")}</div>
      <div class="actions" style="margin-top:12px">
        ${best ? '<button class="primary" data-track-resume="'+esc(best.id)+'">Track application</button>' : ""}
        <a class="btn" href="${esc(a.url||"#")}" target="_blank" rel="noopener">Open job ↗</a>
      </div>
      <div class="muted" style="margin-top:10px">${esc(a.reliability||"")}</div>
    </div>

    <div class="section">
      <div class="title" style="margin-bottom:8px">All resume matches</div>
      ${rows || '<div class="empty">No resume versions available.</div>'}
    </div>
  `;
}
function applicationCard(a){
  return `
    <div class="card">
      <div class="row">
        <div>
          <div class="title">${esc(a.title||"Untitled role")}</div>
          <div class="muted">${esc(a.company||"")}</div>
          <div class="muted"><span class="badge">${esc(a.status||"Saved")}</span>${a.dateApplied?" · "+dateText(a.dateApplied):""}</div>
        </div>
        <button data-edit-app="${esc(a.id)}">Open</button>
      </div>
    </div>
  `;
}
function viewApplications(){
  return `
    <div class="toolbar">
      <button class="primary" id="addApplicationBtn">+ Add application</button>
      <button id="refreshBtn">↻ Refresh</button>
    </div>
    ${state.applications.map(applicationCard).join("") || '<div class="empty">No applications yet.</div>'}
  `;
}
function companyCard(c){
  return `
    <div class="card">
      <div class="row">
        <div>
          <div class="title">${esc(c.name)}</div>
          <div class="muted">${esc(c.category||"")}</div>
        </div>
        <div class="actions">
          ${c.sourceUrl?'<a class="btn primary" href="'+esc(c.sourceUrl)+'" target="_blank" rel="noopener">Careers ↗</a>':""}
          <button data-edit-company="${esc(c.id)}">Edit</button>
        </div>
      </div>
    </div>
  `;
}
function viewCompanies(){
  return `
    <div class="notice">Your target-company list is stored in Google Sheets. You can edit links, add companies, or remove/deactivate them there through CareerOS.</div>
    <div class="toolbar">
      <input id="companySearch" class="input" placeholder="Search companies…">
      <button class="primary" id="addCompanyBtn">+ Add company</button>
      <button id="refreshCompaniesBtn">↻ Refresh</button>
    </div>
    <div id="companyList">${state.companies.map(companyCard).join("") || '<div class="empty">No companies yet.</div>'}</div>
  `;
}
function viewResumes(){
  return `
    <div class="card">
      <div class="row">
        <div>
          <div class="title">Resume Library</div>
          <div class="muted">Unlimited versions. CareerOS reads the actual resume text when scoring a job.</div>
        </div>
        <div class="actions">
          <button id="indexAllResumesBtn">Index all for matching</button>
          <button class="primary" id="uploadResumeBtn">+ Upload</button>
        </div>
      </div>
      <div class="notice" style="margin-top:10px">
        First-time indexing can take a little longer. After that, job analysis reuses the extracted text.
      </div>
    </div>
    ${state.resumes.map(function(r){
      return `
        <div class="card">
          <div class="row">
            <div>
              <div class="title">${esc(r.name)}</div>
              <div class="muted">${esc(r.type||"Resume")}${r.targetRole?" · "+esc(r.targetRole):""}${r.targetCompany?" · "+esc(r.targetCompany):""}</div>
              <div class="muted">${r.createdAt?"Added "+dateText(r.createdAt):""}</div>
            </div>
            <div class="actions">
              ${r.fileUrl?'<a class="btn" href="'+esc(r.fileUrl)+'" target="_blank" rel="noopener">Open ↗</a>':""}
              <button data-index-resume="${esc(r.id)}">Index</button>
              <button class="danger" data-delete-resume="${esc(r.id)}">Delete</button>
            </div>
          </div>
        </div>
      `;
    }).join("") || '<div class="empty">Upload your first resume version.</div>'}
  `;
}
function viewGmail(){
  return `
    <div class="card">
      <div class="title">Gmail sync</div>
      <div class="notice" style="margin-top:10px">
        CareerOS is intended to use <b>vishalnihalani2@gmail.com</b>.
      </div>
      <div class="muted">Connected account</div>
      <div class="title" style="margin-top:4px">${esc(state.gmailAccount||"Not checked")}</div>
      <button class="primary" id="syncGmailBtn" style="margin-top:12px">Sync Gmail now</button>
      <div class="muted" style="margin-top:10px">The sync is incremental and only checks a bounded recent window.</div>
    </div>
  `;
}

function openModal(title,body){
  $("modalContent").innerHTML=
    '<button class="close" id="closeModal">×</button><h3>'+esc(title)+'</h3>'+body;
  $("dialog").showModal();
  $("closeModal").addEventListener("click",function(){$("dialog").close();});
}
function closeModal(){ if($("dialog").open) $("dialog").close(); }

async function analyzeJob(){
  const u=$("jobUrl").value.trim();
  if(!u) return alert("Paste a job URL first.");
  const btn=$("analyzeBtn");
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Analyzing…';
  try{
    state.analysis=await api("analyzeJob",{url:u});
    render();
  }catch(e){
    alert(e.message);
    btn.disabled=false; btn.textContent="Analyze";
  }
}
async function analyzePasted(){
  const jd=$("fallbackJd").value.trim();
  if(jd.length<50) return alert("Paste the full job description.");
  try{
    state.analysis=await post("analyzePastedJob",{url:state.analysis && state.analysis.url || "",jd:jd});
    render();
  }catch(e){ alert(e.message); }
}
async function createApplication(resumeId){
  const a=state.analysis||{};
  openModal("Track application",`
    <form id="applicationForm" class="form">
      <div class="two">
        <label>Company<input class="input" name="company" value="${esc(a.company||"")}" required></label>
        <label>Role<input class="input" name="title" value="${esc(a.title||"")}" required></label>
      </div>
      <label>Status
        <select class="input" name="status">
          ${STATUSES.map(function(s){return '<option '+(s==="Applied"?"selected":"")+'>'+esc(s)+'</option>';}).join("")}
        </select>
      </label>
      <label>Job URL<input class="input" name="url" value="${esc(a.url||"")}"></label>
      <button class="primary" type="submit">Save application</button>
    </form>
  `);
  $("applicationForm").addEventListener("submit",async function(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const r={
      id:uid(),jobId:"",company:f.get("company"),title:f.get("title"),
      status:f.get("status"),dateApplied:f.get("status")==="Applied"?new Date().toISOString():"",
      resumeId:resumeId||"",recruiter:"",nextAction:"",followUpDate:"",notes:""
    };
    try{
      await post("saveApplication",r);
      state.applications.unshift(r);
      saveCache(); closeModal(); state.tab="applications"; render();
    }catch(x){alert(x.message);}
  });
}
async function addApplication(){
  openModal("Add application",`
    <form id="newApplicationForm" class="form">
      <div class="two">
        <label>Company<input class="input" name="company" required></label>
        <label>Role<input class="input" name="title" required></label>
      </div>
      <label>Status<select class="input" name="status">${STATUSES.map(function(s){return "<option>"+esc(s)+"</option>";}).join("")}</select></label>
      <label>Job URL<input class="input" name="url"></label>
      <label>Notes<textarea class="input" name="notes"></textarea></label>
      <button class="primary" type="submit">Save</button>
    </form>
  `);
  $("newApplicationForm").addEventListener("submit",async function(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const r={
      id:uid(),jobId:"",company:f.get("company"),title:f.get("title"),
      status:f.get("status"),dateApplied:f.get("status")==="Applied"?new Date().toISOString():"",
      resumeId:"",recruiter:"",nextAction:"",followUpDate:"",notes:f.get("notes")||""
    };
    try{
      await post("saveApplication",r);
      state.applications.unshift(r); saveCache(); closeModal(); render();
    }catch(x){alert(x.message);}
  });
}
async function editApplication(id){
  const a=state.applications.find(function(x){return x.id===id;});
  if(!a) return;
  openModal("Application",`
    <form id="editApplicationForm" class="form">
      <div class="two">
        <label>Company<input class="input" name="company" value="${esc(a.company)}"></label>
        <label>Role<input class="input" name="title" value="${esc(a.title)}"></label>
      </div>
      <label>Status<select class="input" name="status">${STATUSES.map(function(s){return '<option '+(s===a.status?"selected":"")+'>'+esc(s)+'</option>';}).join("")}</select></label>
      <label>Follow-up<input class="input" type="date" name="followUpDate" value="${esc(String(a.followUpDate||"").slice(0,10))}"></label>
      <label>Notes<textarea class="input" name="notes">${esc(a.notes||"")}</textarea></label>
      <div class="actions">
        <button class="primary" type="submit">Save</button>
        <button class="danger" type="button" id="deleteApplicationBtn">Delete application</button>
      </div>
    </form>
  `);
  $("editApplicationForm").addEventListener("submit",async function(e){
    e.preventDefault();
    const f=new FormData(e.target);
    Object.assign(a,{company:f.get("company"),title:f.get("title"),status:f.get("status"),followUpDate:f.get("followUpDate"),notes:f.get("notes")});
    try{
      await post("save",{
        sheet:"Applications",id:a.id,JobID:a.jobId||"",Company:a.company,Title:a.title,
        Status:a.status,DateApplied:a.dateApplied||"",ResumeID:a.resumeId||"",Recruiter:a.recruiter||"",
        NextAction:a.nextAction||"",FollowUpDate:a.followUpDate||"",Notes:a.notes||""
      });
      saveCache(); closeModal(); render();
    }catch(x){alert(x.message);}
  });
  $("deleteApplicationBtn").addEventListener("click",function(){deleteApplication(id);});
}
async function deleteApplication(id){
  if(!confirm("Delete this application permanently?")) return;
  try{
    const d=await api("deleteApplicationFast",{id:id});
    if(!d.ok) throw new Error(d.error||"Delete failed.");
    state.applications=state.applications.filter(function(a){return a.id!==id;});
    saveCache(); closeModal(); render();
  }catch(e){alert(e.message);}
}
async function uploadResume(){
  if(!backendReady()) return alert("Connect Apps Script first.");
  openModal("Upload resume",`
    <form id="resumeForm" class="form">
      <input class="input" type="file" name="file" accept=".pdf,.doc,.docx,.txt" required>
      <div class="two">
        <input class="input" name="targetRole" placeholder="Target role">
        <input class="input" name="targetCompany" placeholder="Target company">
      </div>
      <button class="primary" type="submit">Upload</button>
    </form>
  `);
  $("resumeForm").addEventListener("submit",function(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const file=f.get("file");
    if(!file || !file.name) return alert("Choose a file.");
    if(file.size>5*1024*1024) return alert("Maximum file size is 5 MB.");
    const reader=new FileReader();
    reader.onload=async function(){
      try{
        const data=await post("uploadResumeFile",{
          name:file.name,mimeType:file.type||"application/octet-stream",
          base64:String(reader.result).split(",")[1]||"",type:"Resume",
          targetRole:f.get("targetRole"),targetCompany:f.get("targetCompany"),notes:""
        });
        const r=data.record;
        state.resumes.unshift({
          id:r.ID,name:r.Name,type:r.Type,fileUrl:r.FileURL,targetRole:r.TargetRole,
          targetCompany:r.TargetCompany,createdAt:r.CreatedAt
        });
        saveCache(); closeModal(); render();
      }catch(x){alert(x.message);}
    };
    reader.readAsDataURL(file);
  });
}
async function deleteResume(id){
  if(!confirm("Delete this resume/document?")) return;
  try{
    const d=await api("deleteResumeFile",{id:id});
    if(!d.ok) throw new Error(d.error||"Delete failed.");
    state.resumes=state.resumes.filter(function(r){return r.id!==id;});
    saveCache(); render();
  }catch(e){alert(e.message);}
}

async function indexResume(id){
  const btn=document.querySelector('[data-index-resume="'+CSS.escape(id)+'"]');
  if(btn){btn.disabled=true;btn.textContent="Indexing…";}
  try{
    const d=await api("indexResume",{id:id});
    alert("Indexed successfully.\nExtracted characters: "+d.chars);
  }catch(e){
    alert("Resume indexing failed: "+e.message);
  }finally{
    render();
  }
}

async function indexAllResumes(){
  const btn=$("indexAllResumesBtn");
  if(btn){btn.disabled=true;btn.textContent="Indexing…";}
  try{
    const d=await api("indexAllResumes");
    const failed=d.failed||0;
    alert("Resume indexing complete.\nIndexed: "+(d.indexed||0)+"\nFailed: "+failed);
    await syncAll();
    state.tab="resumes";
  }catch(e){
    alert("Resume indexing failed: "+e.message);
  }finally{
    render();
  }
}

async function addCompany(){
  openModal("Add company",`
    <form id="companyForm" class="form">
      <div class="two">
        <label>Company<input class="input" name="name" required></label>
        <label>Category<input class="input" name="category" placeholder="Fintech / Tech / Bank"></label>
      </div>
      <label>Careers URL<input class="input" name="sourceUrl" type="url" placeholder="https://…"></label>
      <label>ATS<input class="input" name="ats" placeholder="Greenhouse / Lever / Workday / Custom"></label>
      <button class="primary" type="submit">Save company</button>
    </form>
  `);
  $("companyForm").addEventListener("submit",async function(e){
    e.preventDefault();
    const f=new FormData(e.target);
    const c={id:uid(),name:f.get("name"),category:f.get("category"),sourceUrl:f.get("sourceUrl"),ats:f.get("ats"),active:true,lastChecked:"",notes:""};
    try{
      await post("save",{
        sheet:"Companies",id:c.id,Name:c.name,Category:c.category,ATS:c.ats,
        SourceURL:c.sourceUrl,Active:true,LastChecked:"",Notes:""
      });
      state.companies.push(c); saveCache(); closeModal(); render();
    }catch(x){alert(x.message);}
  });
}
async function editCompany(id){
  const c=state.companies.find(function(x){return x.id===id;});
  if(!c)return;
  openModal("Edit company",`
    <form id="editCompanyForm" class="form">
      <label>Company<input class="input" name="name" value="${esc(c.name)}"></label>
      <label>Category<input class="input" name="category" value="${esc(c.category)}"></label>
      <label>Careers URL<input class="input" name="sourceUrl" value="${esc(c.sourceUrl)}"></label>
      <label>ATS<input class="input" name="ats" value="${esc(c.ats)}"></label>
      <button class="primary" type="submit">Save</button>
    </form>
  `);
  $("editCompanyForm").addEventListener("submit",async function(e){
    e.preventDefault();
    const f=new FormData(e.target);
    Object.assign(c,{name:f.get("name"),category:f.get("category"),sourceUrl:f.get("sourceUrl"),ats:f.get("ats")});
    try{
      await post("save",{
        sheet:"Companies",id:c.id,Name:c.name,Category:c.category,ATS:c.ats,
        SourceURL:c.sourceUrl,Active:c.active,LastChecked:c.lastChecked||"",Notes:c.notes||""
      });
      saveCache(); closeModal(); render();
    }catch(x){alert(x.message);}
  });
}
async function checkGmailAccount(){
  try{
    const d=await api("getGmailStatus");
    state.gmailAccount=d.account||"";
    saveCache();
  }catch(e){}
}
async function syncGmail(){
  try{
    const status=await api("getGmailStatus");
    if(String(status.account||"").toLowerCase()!=="vishalnihalani2@gmail.com"){
      return alert("This Apps Script deployment is running as "+(status.account||"unknown")+". Use the deployment under vishalnihalani2@gmail.com.");
    }
    const btn=$("syncGmailBtn");
    if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Syncing…';}
    const d=await api("syncGmail");
    state.gmailAccount=d.account||"";
    alert("Gmail sync complete.\nMessages processed: "+d.messagesProcessed+"\nApplications matched: "+d.applicationsMatched+"\nApplications updated: "+d.applicationsUpdated);
    await syncAll();
  }catch(e){
    alert("Gmail sync failed: "+e.message);
  }finally{
    render();
  }
}
async function syncAll(){
  if(!backendReady()) return;
  try{
    const d=await api("fetchAll");
    state.applications=(d.Applications||[]).map(function(x){
      return {id:String(x.ID||uid()),jobId:x.JobID||"",company:x.Company||"",title:x.Title||"",
        status:x.Status||"Saved",dateApplied:x.DateApplied||"",resumeId:x.ResumeID||"",
        followUpDate:x.FollowUpDate||"",recruiter:x.Recruiter||"",nextAction:x.NextAction||"",
        notes:x.Notes||"",url:x.URL||""};
    });
    state.companies=(d.Companies||[]).map(function(x){
      return {id:String(x.ID||uid()),name:x.Name||"",category:x.Category||"",ats:x.ATS||"",
        sourceUrl:x.SourceURL||"",active:String(x.Active).toLowerCase()!=="false",
        lastChecked:x.LastChecked||"",notes:x.Notes||""};
    });
    state.resumes=(d.ResumeLibrary||[]).map(function(x){
      return {id:String(x.ID||uid()),name:x.Name||"",type:x.Type||"Resume",
        fileUrl:x.FileURL||"",targetRole:x.TargetRole||"",targetCompany:x.TargetCompany||"",
        createdAt:x.CreatedAt||""};
    });
    await checkGmailAccount();
    saveCache();
    render();
  }catch(e){
    console.error(e);
  }
}
function bindEvents(){
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click",function(){state.tab=b.dataset.go;render();});
  });
  if($("analyzeBtn")) $("analyzeBtn").addEventListener("click",analyzeJob);
  if($("pasteAnalyzeBtn")) $("pasteAnalyzeBtn").addEventListener("click",analyzePasted);
  if($("addApplicationBtn")) $("addApplicationBtn").addEventListener("click",addApplication);
  if($("refreshBtn")) $("refreshBtn").addEventListener("click",function(){syncAll();});
  if($("uploadResumeBtn")) $("uploadResumeBtn").addEventListener("click",uploadResume);
  if($("indexAllResumesBtn")) $("indexAllResumesBtn").addEventListener("click",indexAllResumes);
  if($("addCompanyBtn")) $("addCompanyBtn").addEventListener("click",addCompany);
  if($("refreshCompaniesBtn")) $("refreshCompaniesBtn").addEventListener("click",function(){syncAll();});
  if($("syncGmailBtn")) $("syncGmailBtn").addEventListener("click",syncGmail);

  document.querySelectorAll("[data-track-resume]").forEach(function(b){
    b.addEventListener("click",function(){createApplication(b.dataset.trackResume);});
  });
  document.querySelectorAll("[data-edit-app]").forEach(function(b){
    b.addEventListener("click",function(){editApplication(b.dataset.editApp);});
  });
  document.querySelectorAll("[data-delete-resume]").forEach(function(b){
    b.addEventListener("click",function(){deleteResume(b.dataset.deleteResume);});
  });
  document.querySelectorAll("[data-index-resume]").forEach(function(b){
    b.addEventListener("click",function(){indexResume(b.dataset.indexResume);});
  });
  document.querySelectorAll("[data-edit-company]").forEach(function(b){
    b.addEventListener("click",function(){editCompany(b.dataset.editCompany);});
  });

  const search=$("companySearch");
  if(search){
    search.addEventListener("input",function(){
      const q=search.value.toLowerCase();
      $("companyList").innerHTML=state.companies.filter(function(c){
        return (c.name+" "+c.category).toLowerCase().indexOf(q)>=0;
      }).map(companyCard).join("") || '<div class="empty">No matching companies.</div>';
      document.querySelectorAll("[data-edit-company]").forEach(function(b){
        b.addEventListener("click",function(){editCompany(b.dataset.editCompany);});
      });
    });
  }
}

$("settingsBtn").addEventListener("click",function(){
  openModal("Settings",`

      <label>CareerOS Apps Script /exec URL
        <input class="input" name="backend" value="${esc(state.backend)}" placeholder="https://script.google.com/macros/s/.../exec">
